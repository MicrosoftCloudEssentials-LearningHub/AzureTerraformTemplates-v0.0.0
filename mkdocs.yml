site_name: Azure Terraform Templates
site_description: Learning hub for safely adapting sample Terraform templates for Azure resources.
site_url: https://cloud2br-msftlearninghub.github.io/AzureTerraformTemplates-v0.0.0/
repo_url: https://github.com/Cloud2BR-MSFTLearningHub/AzureTerraformTemplates-v0.0.0
repo_name: Cloud2BR-MSFTLearningHub/AzureTerraformTemplates-v0.0.0
docs_dir: docs
site_dir: site
use_directory_urls: true
copyright: Copyright &copy; 2026 <a href="https://github.com/Cloud2BR-MSFTLearningHub" target="_blank" rel="noopener">Cloud2BR OSS - Learning Hub</a>

theme:
  name: material
  logo: https://avatars.githubusercontent.com/u/195347873?v=4
  favicon: https://avatars.githubusercontent.com/u/195347873?v=4
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    scheme: default
    primary: blue
    accent: blue

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path:
        - .
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_css:
  - assets/css/custom.css
extra_javascript:
  - assets/js/logo-link.js
  - assets/js/external-links.js
  - path: assets/js/mermaid.js
    type: module
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Cloud2BR-MSFTLearningHub
      name: Cloud2BR OSS - Learning Hub

nav:
  - Home: index.md
  - Use templates safely: use-templates-safely.md
  - Template catalog: template-catalog.md
  - Secure and govern deployments: secure-and-govern-deployments.md
  - Operate Terraform changes: operate-terraform-changes.md